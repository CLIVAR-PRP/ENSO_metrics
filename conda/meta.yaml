{% set name = "enso_metrics" %}
{% set version = "2.0.0" %}

package:
    name: {{ name|lower }}
    version: {{ version }}

source:
    url: https://github.com/CLIVAR-PRP/ENSO_metrics/archive/refs/tags/v{{ version }}.tar.gz
    sha256: 1b09f57803777fafde43edc508b7a2b5934b0faf2ddcfe1a7acf30ecccca6b39

build:
  number: 0
  skip: True  # [win]
  script: {{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python
    - pip
  run:
    - python
    - numpy
    - scipy
    - packaging
    - xarray
    - xcdat
    - cftime
    - matplotlib
    - cartopy
    - cmocean
    - regionmask
    - xesmf

test:
  imports:
    - EnsoMetrics.EnsoCollectionsLib
    - EnsoMetrics.EnsoComputeMetricsLib
  commands:
    - pip check
  requires:
    - pip
    - pytest

about:
    home: https://github.com/CLIVAR-PRP/ENSO_metrics
    license: BSD-3-Clause
    license_file: LICENSE
    summary: "Library to compute ENSO metrics"

extra:
  recipe-maintainers:
    - lee1043
    - kristinchang3
    - yyplanton
    - eguil
